server {
    listen 10000;
    server_name _;
    client_max_body_size 200M;

    root /var/www/public;
    index index.php index.html;
    
    # CORS – Để Laravel handle qua config/cors.php
    # add_header 'Access-Control-Allow-Origin' '*' always;
    # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    # add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
    # add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Handle preflight (Laravel HandleCors middleware sẽ xử lý cái này)
    # if ($request_method = OPTIONS) {
    #     return 204;
    # }


    # MIME types (tránh browser chặn CSS)
    include /etc/nginx/mime.types;

    # Swagger assets need content-type override because Laravel response headers
    # are lost/rewritten by the front proxy (Render/Cloudflare).  Serve them via the
    # normal Laravel route but make sure nginx tells the browser the correct type.
    location ~ ^/docs/asset/.*\.css$ {
        add_header Content-Type text/css always;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/docs/asset/.*\.js$ {
        add_header Content-Type application/javascript always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve static files (except Swagger assets which are served by Laravel)
    # exclude the /docs/asset directory so requests go through the normal Laravel route.
    location ~* ^/(?!docs/asset/).*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    location ^~ /vendor/ {
    root /var/www/public;
    try_files $uri =404;
    access_log off;
    expires 30d;
    }
}